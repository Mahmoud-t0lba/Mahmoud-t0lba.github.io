<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>روابط القرآن والأذكار</title>
    <script>
      (function redirectToArabicLanding() {
        const targetBase = "https://mahmoud-t0lba.github.io/moshaf_app/";
        const url = new URL(targetBase);

        const currentParams = new URLSearchParams(window.location.search || "");
        currentParams.set("lang", "ar");

        url.search = currentParams.toString();
        url.hash = window.location.hash || "";

        window.location.replace(url.toString());
      })();
    </script>
  </head>
  <body>
    <p>
      جارٍ التحويل إلى
      <a href="https://mahmoud-t0lba.github.io/moshaf_app/?lang=ar">صفحة القرآن والأذكار العربية</a>
      ...
    </p>
  </body>
</html>
